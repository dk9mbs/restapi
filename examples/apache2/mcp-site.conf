# Apache2 Site für den MCP-Server (Streamable HTTP) mit eigenem Hostnamen
# Alternative zu mcp.conf (Include im bestehenden VirtualHost von dk9mbs.de).
#
# Voraussetzungen:
#   - DNS-Eintrag für mcp.dk9mbs.de
#   - Zertifikat, z. B.: certbot certonly --apache -d mcp.dk9mbs.de
#   - Module: a2enmod ssl proxy proxy_http headers
#
# Aktivieren:
#   cp mcp-site.conf /etc/apache2/sites-available/mcp.dk9mbs.de.conf
#   <TOKEN> ersetzen, z. B. erzeugt mit: openssl rand -hex 32
#   a2ensite mcp.dk9mbs.de
#   apachectl configtest && systemctl reload apache2
#
# In /etc/restapi/mcp.<instance>.env muss der Hostname erlaubt sein:
#   MCP_PUBLIC_HOST=mcp.dk9mbs.de
#
# URL für den MCP-Client: https://mcp.dk9mbs.de/

# Port 80 nur als Umleitung auf https - das Token darf nie unverschlüsselt übertragen werden
<VirtualHost *:80>
        ServerName mcp.dk9mbs.de
        Redirect permanent / https://mcp.dk9mbs.de/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
        ServerName mcp.dk9mbs.de
        ServerAdmin webmaster@localhost

        ProxyPreserveHost On
        ProxyTimeout 300

        # MCP-Endpunkt direkt unter https://mcp.dk9mbs.de/ (ohne /mcp).
        # Apache bildet / auf den Pfad /mcp des MCP-Servers ab, MCP_PATH bleibt /mcp.
        <Location />
            # Zugriffsschutz: der MCP-Server selbst kennt keine Benutzer, er arbeitet
            # mit dem API-Key des MCP-Benutzers. Deshalb hier ein Token verlangen.
            <RequireAll>
                Require all granted
                Require expr "%{HTTP:Authorization} == 'Bearer <TOKEN>'"
            </RequireAll>

            # flushpackets=on: Antworten als Server-Sent Events sofort durchreichen
            ProxyPass        http://127.0.0.1:8765/mcp flushpackets=on timeout=300 keepalive=On
            ProxyPassReverse http://127.0.0.1:8765/mcp

            # Keine Kompression/Pufferung für SSE-Streams
            SetEnv no-gzip 1
            SetEnv proxy-sendchunked 1
            Header always set X-Accel-Buffering "no"
        </Location>

        ErrorLog /var/log/apache2/error.log
        LogLevel warn
        CustomLog /var/log/apache2/access.log combined

        Include /etc/letsencrypt/options-ssl-apache.conf
        SSLCertificateFile /etc/letsencrypt/live/mcp.dk9mbs.de/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/mcp.dk9mbs.de/privkey.pem
</VirtualHost>
</IfModule>


