# Apache2 Reverse Proxy für den MCP-Server (Streamable HTTP)
# Benötigte Module:  a2enmod proxy proxy_http headers
# Einbinden in den bestehenden <VirtualHost *:443> von dk9mbs.de, z. B. per
#   Include <BASEDIR>/examples/apache2/mcp.conf  (oder vorher anpassen und kopieren)
#
# Der MCP-Service liest seine Einstellungen aus /etc/restapi/mcp.<instance>.env, z. B.:
#   MCP_TRANSPORT=streamable-http MCP_HOST=127.0.0.1 MCP_PORT=8765 \
#   MCP_PATH=/mcp MCP_PUBLIC_HOST=dk9mbs.de

ProxyPreserveHost On
ProxyTimeout 300

<Location /mcp>
    # Zugriffsschutz: der MCP-Server selbst kennt keine Benutzer, er arbeitet
    # mit dem API-Key des MCP-Benutzers. Deshalb hier ein Token verlangen.
    # <TOKEN> ersetzen, z. B. erzeugt mit: openssl rand -hex 32
    <RequireAll>
        Require all granted
        Require expr "%{HTTP:Authorization} == 'Bearer <TOKEN>'"
    </RequireAll>

    # flushpackets=on: Antworten als Server-Sent Events sofort durchreichen
    ProxyPass        http://127.0.0.1:8765/mcp flushpackets=on timeout=300 keepalive=On
    ProxyPassReverse http://127.0.0.1:8765/mcp

    # Keine Kompression/Pufferung für SSE-Streams
    SetEnv no-gzip 1
    SetEnv proxy-sendchunked 1
    Header always set X-Accel-Buffering "no"
</Location>
